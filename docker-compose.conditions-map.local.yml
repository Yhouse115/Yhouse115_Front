name: whyhouse-condition-map

# Local-only stack for testing the condition-map walking-route flow.
# It deliberately uses 8001/5173 so an existing WhyHouse stack on 8000/3000 stays untouched.
services:
  backend:
    build:
      context: ./development/Yhouse115/yhonse115_backend
    env_file:
      - path: ./development/Yhouse115/yhonse115_backend/.env
        required: true
    environment:
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8001:8000"
    volumes:
      - ./development/Yhouse115/yhonse115_backend/app:/app/app:ro

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: >
      sh -c "export VITE_SUPABASE_URL=\"$$(grep -m 1 '^SUPABASE_URL=' /run/whyhouse-backend.env | cut -d= -f2- | tr -d '\\r')\";
      export VITE_SUPABASE_ANON_KEY=\"$$(grep -m 1 '^SUPABASE_ANON_KEY=' /run/whyhouse-backend.env | cut -d= -f2- | tr -d '\\r')\";
      npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    env_file:
      - path: .env
        required: false
    environment:
      VITE_API_BASE_URL: http://localhost:8001
      SUPABASE_SERVICE_ROLE_KEY: ""
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - ./development/Yhouse115/yhonse115_backend/.env:/run/whyhouse-backend.env:ro
      - condition_map_frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  condition_map_frontend_node_modules:
